<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<h2>Proyectos realizados</h2>

<body>

<section class="contacto">

    <h1>Contacto</h1>
    <p>Completa el formulario y te responderé lo más pronto posible</p>

    <form id="miformulario" action="guardar_contactos.php" method="POST">
    
    <div class="campo">
        <label>Nombre</label>
        <input type="text" name="nombre" placeholder="Tu nombre" required>
    </div>

    <div class="campo">
        <label>Teléfono</label>
        <input type="tel" name="telefono" placeholder="Tu teléfono" required>
    </div>

    <div class="campo">
        <label>Correo</label>
        <input type="email" name="correo" placeholder="Tu correo" required>
    </div>

    <div class="campo">
        <label>Mensaje</label>
        <textarea name="mensaje" placeholder="Escribe tu mensaje" required></textarea>
    </div>

    <input class="boton-enviar" type="submit" value="Enviar">

</form>
</section>

<section 
    <!-- BOTÓN WHATSAPP -->
    <a href="#" class="whatsapp" onclick="enviarWhatsApp()">
        <i class="fab fa-whatsapp"></i> Contactar por WhatsApp
    </a>

    <!-- TESTIMONIO / CONFIANZA -->
    <div class="info-extra">
        <h2>¿Por qué contactarme?</h2>

        <div class="beneficios">
            <div class="beneficio">
                <p>"Respuesta rápida y atención personalizada."</p>
            </div>

            <div class="beneficio">
                <p>"Trabajo profesional y garantizado."</p>
            </div>

            <div class="beneficio">
                <p>"Más de 10 clientes satisfechos."</p>
            </div>
        </div>
    </div>

</section>

<!-- SCRIPT WHATSAPP -->
<script>
function enviarWhatsApp() {
    let nombre = document.getElementById("nombre").value;
    let mensaje = document.getElementById("mensaje").value;

    let numero = "901144699"; // 🔴 CAMBIA POR TU NUMERO

    let texto = "Hola, soy " + nombre + ". " + mensaje;

    let url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(texto);

    window.open(url, "_blank");
}
</script>

</body>
</html>
